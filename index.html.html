<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행복기숙사 룸메이트 테스트</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap');
:root{--ink:#243047;--blue:#4f7cff;--yellow:#ffd96a;--bg:#f5f7fb;--line:#e7ebf2;--muted:#7d8798;--soft:#eef4ff;--mint:#eaf8f2;--pink:#fff0f2;--purple:#f1edff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(180deg,#f7f9fc 0%,#eef3f8 100%);color:var(--ink);font-family:"Noto Sans KR",sans-serif;min-height:100vh}
button{font:inherit}
.page{width:min(100%,680px);min-height:100vh;margin:auto;padding:18px 16px 28px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;color:#6e788a;padding:3px 4px 14px;letter-spacing:.02em}.logo-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--blue);margin-right:6px}
.card{background:#fff;border:1px solid #e4e9f0;border-radius:28px;overflow:hidden;box-shadow:0 14px 35px rgba(45,62,88,.09)}.hidden{display:none!important}
.start-hero{position:relative;min-height:590px;padding:42px 28px 26px;overflow:hidden;background:linear-gradient(145deg,#fafdff 0%,#eef6ff 62%,#fff8df 100%)}
.blob{position:absolute;border-radius:50%;opacity:.7}.b1{width:190px;height:190px;background:#dce9ff;right:-75px;top:-75px}.b2{width:125px;height:125px;background:#ffe1e7;left:-65px;bottom:45px}.star{position:absolute;color:#9bb5ff;font-size:20px}.s1{right:34px;top:132px}.s2{left:28px;top:255px}.s3{right:80px;bottom:34px}
.eyebrow{position:relative;font-size:11px;font-weight:900;color:var(--blue);letter-spacing:.08em}.start-hero h1{position:relative;font-family:"Jua",sans-serif;font-size:clamp(42px,10vw,66px);line-height:1.05;letter-spacing:-.06em;margin:14px 0 14px}.lead{position:relative;font-size:15px;line-height:1.65;font-weight:600;color:#5e687a}
.mascot-wrap{width:218px;height:255px;background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.9);border-radius:50px;margin:28px auto 0;display:flex;align-items:flex-end;justify-content:center;position:relative;z-index:2;box-shadow:0 15px 30px rgba(50,70,100,.09)}.mascot-wrap img{width:182px;margin-bottom:0}.pill{display:inline-flex;align-items:center;background:#fff;color:var(--ink);border:1px solid #e4e9f0;border-radius:999px;padding:8px 13px;font-size:11px;font-weight:900;margin-top:18px;box-shadow:0 5px 15px rgba(50,70,100,.07)}
.start-body{padding:20px 22px 24px}.primary{width:100%;border:0;background:var(--blue);color:#fff;border-radius:15px;padding:16px 18px;font-size:16px;font-weight:900;cursor:pointer;box-shadow:0 7px 16px rgba(79,124,255,.22);transition:transform .15s,box-shadow .15s}.primary:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(79,124,255,.27)}.primary:active{transform:translateY(1px);box-shadow:0 4px 10px rgba(79,124,255,.18)}.subnote{text-align:center;color:#8b94a3;font-size:11px;margin-top:12px}
.quiz-head{padding:20px 22px 14px;background:#fff;border-bottom:1px solid #f0f2f5}.qtop{display:flex;justify-content:space-between;gap:10px;font-size:11px;font-weight:900;color:#8a94a4}.track{height:7px;background:#edf0f5;border-radius:99px;margin-top:10px;overflow:hidden}.track i{display:block;height:100%;width:0;background:var(--blue);border-radius:99px;transition:width .3s ease}.question-area{padding:30px 22px 26px}.question-area h2{font-family:"Jua",sans-serif;font-size:28px;line-height:1.35;letter-spacing:-.04em;margin:0 0 20px}.choice{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:16px;padding:16px 15px;margin:6px 0;cursor:pointer;font-size:15px;line-height:1.5;font-weight:700;color:var(--ink);transition:all .15s ease;box-shadow:0 3px 10px rgba(40,55,80,.035)}.choice:hover,.choice:focus{border-color:#a9c0ff;background:#f8faff;transform:translateY(-1px);outline:none}.choice:active{transform:scale(.99)}.choice b{display:inline-flex;align-items:center;justify-content:center;width:25px;height:25px;border-radius:8px;background:var(--soft);font-size:11px;color:var(--blue);margin-right:9px}
.result-top{padding:30px 22px 26px;text-align:center;background:linear-gradient(145deg,#fbfdff 0%,#eef6ff 62%,#fff8df 100%)}.result-label{display:inline-block;background:#fff;border:1px solid #e4e9f0;color:#6e788a;padding:7px 12px;border-radius:999px;font-size:11px;font-weight:900}.result-mascot{width:175px;height:190px;margin:16px auto 10px;background:#fff;border-radius:34px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;box-shadow:0 10px 25px rgba(40,55,80,.07)}.result-mascot img{width:145px}.result-type{font-family:"Jua",sans-serif;font-size:38px;letter-spacing:-.06em;margin:7px 0;color:var(--ink)}.result-desc{margin:0 auto;max-width:510px;line-height:1.7;font-weight:600;font-size:14px;color:#626d7e}.result-body{padding:24px 22px 26px}.section-title{font-weight:900;font-size:14px;margin-bottom:12px}.badges{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px}.badge{padding:8px 10px;border-radius:999px;font-size:11px;font-weight:900}.b1c{background:#eaf2ff;color:#5373bd}.b2c{background:#fff0f2;color:#c06b7b}.b3c{background:#eaf8f2;color:#4f9675}.b4c{background:#f1edff;color:#7564ad}.advice{background:#f7f8fa;border:1px solid #edf0f4;border-radius:16px;padding:15px;line-height:1.7;font-size:13px;margin:17px 0}.share-card{display:none}.buttons{display:grid;gap:9px}.secondary{background:#fff!important;color:var(--ink)!important;border:1px solid #dfe4eb!important;box-shadow:none!important}.footer{text-align:center;color:#9aa2af;font-size:10px;line-height:1.6;margin-top:15px}
@media (max-width:520px){.page{padding:10px 10px 20px}.top{padding:2px 3px 10px}.card{border-radius:22px}.start-hero{min-height:0;padding:34px 21px 22px}.start-hero h1{font-size:clamp(40px,12vw,55px)}.lead{font-size:14px}.mascot-wrap{width:190px;height:220px;margin-top:24px;border-radius:42px}.mascot-wrap img{width:160px}.start-body{padding:16px 16px 20px}.primary{padding:15px 16px}.question-area{padding:25px 16px 21px}.question-area h2{font-size:25px}.choice{font-size:14px;padding:15px 13px}.result-top{padding:25px 17px 22px}.result-mascot{width:155px;height:170px}.result-mascot img{width:128px}.result-type{font-size:34px}.result-desc{font-size:13px}.result-body{padding:21px 16px 23px}}
@media (max-width:360px){.start-hero{padding-top:29px}.mascot-wrap{width:175px;height:205px}.mascot-wrap img{width:148px}.question-area h2{font-size:23px}.choice{font-size:13px}}
</style>
</head>

let q=0, score={};
function startTest(){document.getElementById("start").classList.add("hidden");document.getElementById("quiz").classList.remove("hidden");renderQ();}
function renderQ(){
 const item=questions[q];
 document.getElementById("qnum").textContent=`Q${q+1} / ${questions.length}`;
 document.getElementById("track").style.width=((q+1)/questions.length*100)+"%";
 document.getElementById("question").textContent=item[0];
 const box=document.getElementById("choices");box.innerHTML="";
 item[1].forEach((choice,i)=>{
   const b=document.createElement("button");b.className="choice";
   b.innerHTML=`<b>${i+1}</b>${choice[0]}`;
   b.onclick=()=>answer(choice[1]);box.appendChild(b);
 });
}
function answer(points){
 Object.entries(points).forEach(([k,v])=>score[k]=(score[k]||0)+v);
 q++;
 if(q<questions.length) renderQ(); else showResult();
}

const typeImageMap={
  "깔끔 룸메이트":2,
  "조용한 룸메이트":0,
  "활기찬 룸메이트":1,
  "배려형 룸메이트":1,
  "계획형 룸메이트":2,
  "집콕 충전형":0,
  "유연한 적응형":1,
  "독립적인 룸메이트":0
};
function showResult(){
 document.getElementById("quiz").classList.add("hidden");
 document.getElementById("result").classList.remove("hidden");
 let ranked=types.map((t,i)=>({t,i,s:t.keys.reduce((sum,k)=>sum+(score[k]||0),0)})).sort((a,b)=>b.s-a.s);
 const t=ranked[0].t;
 document.getElementById("resultMascot").src=resultImages[typeImageMap[t.name]-1];
 document.getElementById("typeName").textContent=t.name;
 document.getElementById("typeDesc").textContent=t.desc;
 document.getElementById("shareType").textContent=t.name;
 document.getElementById("badges").innerHTML=t.badges.map((x,i)=>`<span class="badge ${["b1c","b2c","b3c","b4c"][i%4]}">${x}</span>`).join("");
 document.getElementById("advice").innerHTML=t.advice;
}
async function shareResult(){
 if(navigator.share){
   try{await navigator.share({title:"행복기숙사 룸메이트 테스트",url:location.href});}catch(e){}
 }else{
   try{await navigator.clipboard.writeText(location.href);alert("테스트 링크가 복사됐어요!");}
   catch(e){alert("현재 페이지 주소를 복사해서 공유해주세요!");}
 }
}
